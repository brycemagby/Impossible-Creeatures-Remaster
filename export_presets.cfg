[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
// Cloudflare Pages takes files up to 25 MB and the engine is bigger, so the
// website ships it gzipped as index.wasm.gz (see tools/pack_web.sh). This
// fetches and unpacks that, or the plain .wasm when there is no .gz.
(function () {
  const fetchFile = window.fetch.bind(window);
  window.fetch = async function (resource, options) {
    const url = resource instanceof Request ? resource.url : String(resource);
    if (!url.endsWith('.wasm')) return fetchFile(resource, options);
    const packed = await fetchFile(url + '.gz', options);
    if (!packed.ok) return fetchFile(resource, options);
    let bytes = new Uint8Array(await packed.arrayBuffer());
    if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return new Response(bytes, { headers: { 'Content-Type': 'application/wasm', 'Content-Length': String(bytes.length) } });
  };
})();
</script>"
